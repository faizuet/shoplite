name: ShopLite CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shoplite-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install Catalog Dependencies
        run: npm ci --prefix catalog-service

      - name: Check Catalog JavaScript
        run: |
          node --check catalog-service/src/index.js
          node --check catalog-service/src/db.js

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Build Frontend
        run: npm run build --prefix frontend

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: inventory-service/go.mod
          cache-dependency-path: inventory-service/go.sum

      - name: Test Inventory Service
        working-directory: inventory-service
        run: go test ./...

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: order-service/pom.xml

      - name: Verify Orders Service
        run: mvn -B -f order-service/pom.xml verify

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Catalog Image
        uses: docker/build-push-action@v7
        with:
          context: ./catalog-service
          push: false
          tags: shop-catalog:ci

      - name: Build Inventory Image
        uses: docker/build-push-action@v7
        with:
          context: ./inventory-service
          push: false
          tags: shop-inventory:ci

      - name: Build Orders Image
        uses: docker/build-push-action@v7
        with:
          context: ./order-service
          push: false
          tags: shop-orders:ci

      - name: Build Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: shop-frontend:ci

  deploy-ecr:
    name: Deploy Images to AWS ECR
    runs-on: ubuntu-latest
    needs:
      - validate
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: ShopLiteGitHubActions-${{ github.run_id }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Catalog Image
        uses: docker/build-push-action@v7
        with:
          context: ./catalog-service
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/shoplite-catalog:1.0.0
            ${{ env.ECR_REGISTRY }}/shoplite-catalog:latest

      - name: Build and Push Inventory Image
        uses: docker/build-push-action@v7
        with:
          context: ./inventory-service
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/shoplite-inventory:1.0.0
            ${{ env.ECR_REGISTRY }}/shoplite-inventory:latest

      - name: Build and Push Orders Image
        uses: docker/build-push-action@v7
        with:
          context: ./order-service
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/shoplite-orders:1.0.0
            ${{ env.ECR_REGISTRY }}/shoplite-orders:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/shoplite-frontend:1.1.0
            ${{ env.ECR_REGISTRY }}/shoplite-frontend:latest
