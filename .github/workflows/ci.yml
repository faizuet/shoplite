name: ShopLite CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shoplite-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install Catalog Dependencies
        run: npm ci --prefix catalog-service

      - name: Check Catalog JavaScript
        run: |
          node --check catalog-service/src/index.js
          node --check catalog-service/src/db.js

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Build Frontend
        run: npm run build --prefix frontend

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: inventory-service/go.mod
          cache-dependency-path: inventory-service/go.sum

      - name: Test Inventory Service
        working-directory: inventory-service
        run: go test ./...

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: order-service/pom.xml

      - name: Verify Orders Service
        run: mvn -B -f order-service/pom.xml verify

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Catalog Image
        uses: docker/build-push-action@v6
        with:
          context: ./catalog-service
          push: false
          tags: shop-catalog:ci

      - name: Build Inventory Image
        uses: docker/build-push-action@v6
        with:
          context: ./inventory-service
          push: false
          tags: shop-inventory:ci

      - name: Build Orders Image
        uses: docker/build-push-action@v6
        with:
          context: ./order-service
          push: false
          tags: shop-orders:ci

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: shop-frontend:ci
