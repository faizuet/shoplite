# Default server: reject unknown hostnames
server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

# ShopLite application server
server {
    listen 8080;
    server_name ${SERVER_NAME};

    root /usr/share/nginx/html;
    index index.html;

    # Frontend health check
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Catalog API
    # /api/catalog/products -> /products
    location /api/catalog/ {
        proxy_pass http://catalog:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Inventory API
    # /api/inventory/stock/1 -> /stock/1
    location /api/inventory/ {
        proxy_pass http://inventory:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Orders API
    # /api/orders/orders -> /orders
    location /api/orders/ {
        proxy_pass http://orders:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React frontend
    location / {
        try_files $uri $uri/ /index.html;
    }
}
